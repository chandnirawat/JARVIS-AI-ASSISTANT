<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<link rel="stylesheet" href="style.css">
</head>

<body style="background:black; color:white;">
<div class="container">

    <section id="oval" class="mb-4"></section>

    <section id="siriwave" class="mb-4" style="display:none;">
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
                        <div>
                            <p class="text-start text-light mb-4 siri-message" style="font-size: 28px;"></p>
                            <div id="siri-container"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</div>

<div class="row">
    <div class="col-md-1"></div>
    <div class="col-md-10">
        <div class="d-flex justify-content-center align-items-center" style="height:80vh">
            <canvas id="canvasone" width="700" height="320" style="position:absolute;"></canvas>
            <div id="jarvishood">
                <div class="square">
                    <span class="circle"></span>
                    <span class="circle"></span>
                    <span class="circle"></span>
                </div>
            </div>
        </div>
        <h5 class="text-light text-center text">Ask me anything</h5>
    </div>

    <div class="col-md-12">
        <div class="text-center">
            <div id="textinput" class="d-flex justify-content-center">
                <input type="text" id="chatbox" placeholder="Type here..." class="form-control w-50">
                <button id="micbtn" class="glow-on-hover"><i class="bi bi-mic"></i></button>
                <button id="chatBtn" class="glow-on-hover"><i class="bi bi-chat-dots"></i></button>
                <button id="settingsBtn" class="glow-on-hover"><i class="bi bi-gear"></i></button>
            </div>
        </div>
    </div>
</div>

<!-- JS Libraries -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lettering.js/0.7.0/jquery.lettering.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/textillate/0.4.0/jquery.textillate.min.js"></script>
<script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>
<script type="text/javascript" src="/eel.js"></script>

<!-- Custom JS -->
<script>
$(document).ready(function () {

    // Text animation
    if ($.fn.textillate) {
        $('.text').textillate({
            loop: true,
            sync: true,
            in: { effect: "bounceIn" },
            out: { effect: "bounceOut" }
        });
    }

    // SiriWave
    if (typeof SiriWave !== "undefined" && !window.siriWave) {
        window.siriWave = new SiriWave({
            container: document.getElementById("siri-container"),
            width: 800,
            height: 200,
            style: "ios9",
            amplitude: 1,
            speed: 0.3,
            autostart: false
        });
    }

    // Mic click
    $("#micbtn").off("click").on("click", function () {

        console.log("Mic clicked");

        $("#oval").hide();
        $("#siriwave").show();
        $(".siri-message").text("Listening...");

        if (window.siriWave) window.siriWave.start();

        // ✅ FIXED CALL (IMPORTANT)
        eel.allCommands()(function () {

            $(".siri-message").text("Done");

            if (window.siriWave) window.siriWave.stop();
            $("#siriwave").hide();
            $("#oval").show();
        });

    });

});

// ✅ FIXED FUNCTION NAME (Python match)
function displayMessage(msg) {
    $(".siri-message").text(msg);
}

function startSiriWave() {
    if (window.siriWave) window.siriWave.start();
}

function stopSiriWave() {
    if (window.siriWave) window.siriWave.stop();
}

// ✅ expose to Python
eel.expose(displayMessage);
eel.expose(startSiriWave);
eel.expose(stopSiriWave);
</script>

</body>
</html>
